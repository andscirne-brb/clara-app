<!doctype html><html lang="pt"><head><base target="_top"><meta charset="utf-8"><style>
body{font:13px/1.5 Arial;color:#183746;background:#f3f6fa;padding:12px}h1{font-size:19px}label{display:block;margin:12px 0 4px}input,select,button{box-sizing:border-box;width:100%;padding:10px;border:1px solid #a9bdc8;border-radius:6px}button{background:#087f8c;color:white;margin-top:12px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.box{background:white;padding:12px;border-radius:9px;margin:12px 0}.muted{font-size:12px;color:#526b78}#msg{white-space:pre-line}a{color:#087f8c}[hidden]{display:none}</style></head><body>
<h1>eGO: estado</h1><p>Atualizar documentos e planta por referência.</p><p class="muted">Regista no Sheets o trabalho que fizeste. Não altera o eGO.</p>
<label for="ref">Referência do imóvel</label><input id="ref" placeholder="Ex.: MI14372" autocomplete="off"><button id="buscar" onclick="buscar()">Pesquisar</button>
<p id="msg" role="status" aria-live="polite"></p><section id="form" class="box" hidden><h2 id="imovel"></h2><label for="website">Visibilidade no website da agência</label><select id="website"></select><p class="muted">Confirmação manual. Não altera a disponibilidade no eGO nem a publicação nos portais.</p><button id="guardarWebsite" onclick="guardarWebsite()">Guardar visibilidade do website</button><hr><div id="campos"></div><label for="confirmar"><input style="width:auto" type="checkbox" id="confirmar"> Confirmo os estados escolhidos</label><button id="guardar" onclick="guardar()">Guardar alterações</button></section>
<button onclick="google.script.run.abrirPainel()">Voltar à leitura do marcador</button>
<script>
const $=id=>document.getElementById(id);let snapshot=null,busy=false;
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bloquear(v){busy=v;$('buscar').disabled=v;$('guardar').disabled=v;$('guardarWebsite').disabled=v;$('ref').disabled=v;document.querySelectorAll('select').forEach(s=>s.disabled=v);}
function falha(e){bloquear(false);$('msg').textContent=e.message||String(e);}
function buscar(){if(busy)return;snapshot=null;$('form').hidden=true;bloquear(true);$('msg').textContent='A procurar…';google.script.run.withSuccessHandler(s=>{snapshot=s;$('imovel').textContent=s.ref;$('website').innerHTML=s.opcoesWebsite.map(o=>'<option'+(o===s.website?' selected':'')+'>'+esc(o)+'</option>').join('');$('campos').innerHTML=s.campos.map(c=>'<label for="ed_'+c.id+'">'+esc(c.nome)+'</label><select id="ed_'+c.id+'">'+s.opcoes.map(o=>'<option value="'+esc(o)+'"'+(o===s.estados[c.id]?' selected':'')+'>'+esc(o==='Não aplicável'?'N/A':o)+'</option>').join('')+'</select>').join('');$('confirmar').checked=false;$('form').hidden=false;$('msg').textContent='Digitalizado: falta preparar e inserir no eGO. Ausente também no dossier: encaminhado para Sara.';bloquear(false);}).withFailureHandler(falha).pesquisarEstadoDocumental($('ref').value);}
function guardar(){if(busy||!snapshot)return;if(!$('confirmar').checked){$('msg').textContent='Confirma os estados antes de guardar.';return;}const estados={};snapshot.campos.forEach(c=>estados[c.id]=$('ed_'+c.id).value);bloquear(true);$('msg').textContent='A guardar e sincronizar…';google.script.run.withSuccessHandler(r=>{snapshot=null;$('form').hidden=true;bloquear(false);$('msg').textContent=r.ref+': guardado. Levantamento, pendências e resumo atualizados.';}).withFailureHandler(falha).guardarEstadoDocumental(snapshot.ref,estados,snapshot.assinatura);}
function guardarWebsite(){if(busy||!snapshot)return;const ref=snapshot.ref;bloquear(true);$('msg').textContent='A guardar a visibilidade…';google.script.run.withSuccessHandler(r=>{snapshot=null;$('form').hidden=true;bloquear(false);$('msg').textContent=ref+': visibilidade guardada no levantamento e no histórico. Pesquisa novamente para editar outros campos.';}).withFailureHandler(falha).guardarVisibilidadeWebsite(ref,$('website').value,snapshot.assinatura);}
$('ref').addEventListener('input',()=>{snapshot=null;$('form').hidden=true;});
</script></body></html>
