<!doctype html><html lang="pt"><head><meta charset="utf-8"><base target="_blank"><style>
body{font:14px Arial,sans-serif;color:#183746;margin:20px;background:#f3f6fa}h1{font-size:23px;margin-bottom:8px}h2{font-size:18px}.muted{color:#526b78;line-height:1.5}.cards{display:flex;gap:12px;margin:18px 0}.card{background:white;border:1px solid #dce5e9;padding:14px;border-radius:8px;flex:1}.number{font-size:28px;font-weight:bold;display:block;margin-bottom:6px}button,select{font:inherit;padding:10px;border-radius:5px;border:1px solid #b8ccd5;background:white;color:#183746}button{cursor:pointer;background:#087f8c;color:white}button:disabled{opacity:.55;cursor:wait}.toolbar{display:flex;align-items:center;gap:12px}table{border-collapse:collapse;width:100%;background:white;margin:12px 0}th,td{text-align:left;border-bottom:1px solid #dce5e9;padding:10px;vertical-align:top}th{background:#183746;color:white}.acao{color:#895000}.desconhecido{color:#526b78}.registado{color:#156c4b}.warning{background:#fff5df;border-left:3px solid #d29428;padding:12px;line-height:1.5}a{color:#087f8c}summary{cursor:pointer}#error{color:#a12424}option{color:#183746}
</style></head><body><h1>Auditoria dos imóveis prioritários</h1><p class="muted">Últimos estados registados · consulta sem alterações ao levantamento ou às pendências.</p><div class="toolbar"><button id="refresh" onclick="carregar()">Atualizar consulta</button><span id="time" class="muted" role="status" aria-live="polite"></span></div><p id="error" role="alert"></p><div id="content" hidden><div class="cards" id="cards"></div><label for="ref">Consultar imóvel</label> <select id="ref" onchange="mostrar()"></select><section id="detail"></section><details><summary>O que esta auditoria ainda não verifica</summary><ul id="limits"></ul></details><details><summary>Visão dos prioritários</summary><div id="overview"></div></details></div><script>
let modelo;const el=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function carregar(){const old=el('ref').value;el('refresh').disabled=true;el('error').textContent='';el('time').textContent='A consultar o levantamento…';google.script.run.withSuccessHandler(m=>renderizar(m,old)).withFailureHandler(e=>{el('refresh').disabled=false;el('time').textContent='Consulta não atualizada';el('content').hidden=true;el('error').textContent=e.message||String(e);}).consultarAuditoriaPrioritarios();}
function renderizar(m,old){modelo=m;el('refresh').disabled=false;el('content').hidden=false;el('time').textContent='Consulta: '+m.atualizado;el('ref').innerHTML=m.imoveis.map(x=>'<option value="'+esc(x.ref)+'">'+esc(x.ref+' · '+x.concelho)+'</option>').join('');if(m.imoveis.some(x=>x.ref===old))el('ref').value=old;const a=m.imoveis.filter(x=>x.contagens.acoes).length,d=m.imoveis.filter(x=>x.contagens.desconhecidos||x.duplicada).length;el('cards').innerHTML=[[m.quantidade,'Imóveis prioritários'],[a,'Com ações registadas'],[d,'Com campos por verificar'],[m.imoveis.filter(x=>(x.alertas||[]).some(a=>a.avisos.length)).length,'Com avisos de desempenho']].map(x=>'<div class="card"><span class="number">'+x[0]+'</span>'+esc(x[1])+'</div>').join('');el('limits').innerHTML=m.limites.map(x=>'<li>'+esc(x)+'</li>').join('');el('overview').innerHTML='<table><thead><tr><th>Referência</th><th>Estado registado</th><th>Ações</th><th>Por verificar</th><th>Avisos de desempenho</th></tr></thead><tbody>'+m.imoveis.map(x=>'<tr><td>'+esc(x.ref)+'</td><td>'+esc(x.estado)+'</td><td>'+x.contagens.acoes+'</td><td>'+x.contagens.desconhecidos+'</td><td>'+(x.alertas||[]).reduce((n,a)=>n+a.avisos.length,0)+'</td></tr>').join('')+'</tbody></table>';mostrar();}
function comparacaoHtml(c){if(!c)return '';const preco=v=>typeof v==='number'?v.toLocaleString('pt-PT',{style:'currency',currency:'EUR'}):'Por confirmar';return '<h2>Preços · comparação com a base eGO</h2><p class="muted">Exportação eGO: '+esc(c.dataEgo||'data por confirmar')+' · '+esc(c.estadoBase)+'</p><p class="muted">'+esc(c.fonteEgo)+'</p><p>Natureza eGO: '+esc(c.natureza||'Por confirmar')+' · Concelho eGO: '+esc(c.concelho||'Por confirmar')+'</p><p>'+c.precos.map(p=>esc(p.operacao)+': '+esc(preco(p.valor))).join(' · ')+'</p><table><thead><tr><th>Portal / anúncio</th><th>Preço recolhido</th><th>Data da recolha</th><th>Conferência</th></tr></thead><tbody>'+c.portais.map(p=>'<tr><td>'+esc(p.portal)+(p.id?' · '+esc(p.id):'')+'</td><td>'+esc(preco(p.preco))+'</td><td>'+esc(p.recolha||'Sem recolha')+(p.dadosAte?'<br>Dados até '+esc(p.dadosAte):'')+'</td><td>'+esc(p.estado)+(p.diferenca!==null&&p.diferenca!==undefined?'<br>Diferença nominal: '+esc(preco(p.diferenca)):'')+'<br><small>'+esc(p.fonte||'')+'</small></td></tr>').join('')+'</tbody></table><p class="warning">Não é uma confirmação de erro de preço. Verificar no eGO atual e confirmar a mesma operação antes de corrigir. Esta consulta não altera anúncios nem cria pendências.</p><p class="muted">'+esc(c.limites)+'</p>';}
function presencaHtml(lista){if(!lista)return '';return '<h2>Presença observada nos portais</h2><p class="muted">Fontes já recolhidas, associadas por referência e ID confirmados. A data refere-se à recolha, não a uma nova visita ao anúncio.</p><table><thead><tr><th>Portal / anúncio</th><th>Observação</th><th>Recolha / fonte / âmbito</th></tr></thead><tbody>'+lista.flatMap(p=>p.anuncios.length?p.anuncios.map(a=>'<tr><td>'+esc(p.portal)+' · '+esc(a.id)+'</td><td>'+esc(a.estado)+'</td><td>'+esc(a.data||'Sem data de observação')+'<br>'+esc(a.fonte)+'<details><summary>Ver âmbito da recolha</summary><small>'+esc(a.ambito)+'</small></details></td></tr>'):['<tr><td>'+esc(p.portal)+'</td><td>'+esc(p.estado)+'</td><td>'+esc(p.fonte)+'</td></tr>']).join('')+'</tbody></table><p class="warning">Não encontrar uma ligação ou um anúncio numa recolha filtrada não confirma ausência no portal. A presença atual exige uma recolha atual e de âmbito adequado; não são criadas pendências automaticamente.</p>';}
function alertasHtml(lista){if(!lista)return '';return '<h2>Desempenho · avisos para revisão</h2><p class="muted">Comparações dentro de cada portal e anúncio; não compara definições de visitas ou contactos entre portais. Sem criação automática de pendências.</p>'+(lista.length?'<table><thead><tr><th>Portal / anúncio</th><th>Aviso e contexto</th><th>Fonte / período</th></tr></thead><tbody>'+lista.map(a=>'<tr><td>'+esc(a.portal)+' · '+esc(a.id)+'</td><td>'+(a.avisos.length?a.avisos.map(v=>'<p class="acao">'+esc(v)+'</p>').join(''):'<strong>Sem aviso gerado</strong>')+'<p class="muted">'+esc(a.nota||'')+'</p><details><summary>Ver indicadores</summary>'+esc(a.evidencia||'Sem dados suficientes')+'</details></td><td>'+esc(a.fonte)+'<br>'+esc(a.data||'Sem data')+'<br>'+esc(a.periodo||'Período por confirmar')+'</td></tr>').join('')+'</tbody></table>':'<p>Sem anúncios com ligação confirmada para avaliar.</p>')+'<p class="warning">Sem aviso não significa bom desempenho. Pode faltar histórico, período completo ou métricas compatíveis. Os avisos descrevem dados recolhidos e não identificam a causa.</p>';}
function mostrar(){const x=modelo.imoveis.find(x=>x.ref===el('ref').value);if(!x){el('detail').innerHTML='<p>Não existem imóveis com prioridade «Prioritária».</p>';return;}const url=modelo.url+'#gid='+modelo.levantamentoId+'&range=A'+x.linha;el('detail').innerHTML='<h2>'+esc(x.ref)+'</h2><p class="muted">'+esc(x.natureza+' · '+x.concelho)+' · Última verificação registada: '+esc(x.data||'Sem data')+' · <a href="'+esc(url)+'">Ver no levantamento</a></p>'+'<p><strong>Website da agência:</strong> '+esc(x.website||'Por verificar')+'</p>'+(x.duplicada?'<p class="warning">Referência duplicada: rever as linhas antes de usar as associações.</p>':'')+(x.presenca?'':'<table><thead><tr><th>Portal</th><th>Cobertura</th></tr></thead><tbody>'+x.portais.map(p=>'<tr><td>'+esc(p.portal)+'</td><td>'+esc(p.estado)+(p.confirmadas?' · '+p.confirmadas+' anúncio(s)':'')+(p.porRever?' · '+p.porRever+' por rever':'')+'</td></tr>').join('')+'</tbody></table>')+presencaHtml(x.presenca)+alertasHtml(x.alertas)+comparacaoHtml(x.comparacao)+'<p class="warning">«Preenchido» é o estado registado, não uma avaliação da qualidade. «Digitalizado» continua a exigir inserção no eGO. Não existe pontuação global nesta consulta.</p><table><thead><tr><th>Critério</th><th>Estado registado</th><th>Fonte</th></tr></thead><tbody>'+x.criterios.map(c=>'<tr><td>'+esc(c.nome)+'</td><td class="'+c.classe+'">'+esc(c.valor)+'</td><td>'+esc(c.fonte)+'</td></tr>').join('')+'</tbody></table><h2>Acompanhamento da equipa</h2><p class="muted">'+esc(x.resumo||'Sem resumo registado. Consultar as pendências da equipa.')+'</p>';}
const inicial=/*AP_INICIAL*/null;if(inicial)renderizar(inicial,'');else carregar();</script></body></html>
