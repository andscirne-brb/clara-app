<!doctype html>
<html><head><base target="_top"><meta charset="utf-8">
<style>
body{font-family:Arial,sans-serif;font-size:13px;color:#202124;margin:0;padding:12px}
h3{font-size:14px;margin:16px 0 6px}
.muted{color:#5f6368;font-size:12px}
.barra{background:#e8eaed;border-radius:4px;height:8px;margin:4px 0 2px}
.barra div{background:#188038;height:8px;border-radius:4px}
.item{border-left:3px solid #1a73e8;background:#f8f9fa;padding:6px 8px;margin:6px 0}
.item.sara{border-left-color:#f9ab00}
.item b{cursor:pointer;color:#1a73e8}
.item ul{margin:4px 0 0 16px;padding:0}
a{color:#1a73e8}
button{background:#fff;color:#1a73e8;border:1px solid #dadce0;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;margin-top:8px}
</style></head>
<body>
<div id="out">A carregar…</div>
<button onclick="carregar()">Atualizar</button>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function ir(sep,l){google.script.run.irPara(sep,l);}
function liga(u){return u?' · <a href="'+esc(u)+'" target="_blank">página pública</a>':'';}
function barra(a,b,t){const p=b?Math.round(100*a/b):0;return '<div>'+t+': <b>'+a+' de '+b+'</b></div><div class="barra"><div style="width:'+p+'%"></div></div>';}
function mostrar(d){
  let h='<h3>Progresso</h3>'+barra(d.contagem['Prioritária'][0],d.contagem['Prioritária'][1],'Prioritários verificados')+barra(d.verificados,d.total,'Todos os imóveis verificados');
  h+='<h3>1. Prioritários por verificar ('+d.prioritarios.length+')</h3>';
  h+=d.prioritarios.length?d.prioritarios.map(im=>'<div class="item"><b onclick="ir(\'Levantamento\','+im.linha+')">'+esc(im.ref)+'</b> · '+esc(im.natureza)+' · '+esc(im.concelho)+liga(im.url)+'</div>').join(''):'<div class="muted">Todos verificados.</div>';
  h+='<h3>2. As tuas pendências ('+d.minhas.reduce((n,x)=>n+x.pendencias.length,0)+' em '+d.minhas.length+' imóveis)</h3>';
  h+=d.minhas.length?d.minhas.map(im=>'<div class="item"><b onclick="ir(\'Pendências da equipa\','+im.pendencias[0].linha+')">'+esc(im.ref)+'</b> '+(im.prioridade==='Prioritária'?'· prioritário':'')+liga(im.url)+'<ul>'+im.pendencias.map(p=>'<li>'+esc(p.assunto)+'<div class="muted">'+esc(p.acao)+'</div></li>').join('')+'</ul></div>').join(''):'<div class="muted">Nenhuma.</div>';
  h+='<h3>3. À espera da Sara ('+d.sara.length+')</h3>';
  h+=d.sara.length?d.sara.map(p=>'<div class="item sara"><b onclick="ir(\'Pendências da equipa\','+p.linha+')">'+esc(p.ref)+'</b> · '+esc(p.assunto)+'</div>').join(''):'<div class="muted">Nenhuma.</div>';
  if(!d.prioritarios.length&&d.altaTotal)h+='<h3>Depois: prioridade Alta por verificar ('+d.altaTotal+')</h3>'+d.alta.map(im=>'<div class="item"><b onclick="ir(\'Levantamento\','+im.linha+')">'+esc(im.ref)+'</b> · '+esc(im.natureza)+' · '+esc(im.concelho)+liga(im.url)+'</div>').join('');
  h+='<p class="muted">Carrega numa referência para ir à linha no Sheet.</p>';
  document.getElementById('out').innerHTML=h;
}
function carregar(){document.getElementById('out').textContent='A carregar…';google.script.run.withSuccessHandler(mostrar).withFailureHandler(e=>document.getElementById('out').textContent=e.message).listaTrabalho();}
carregar();
</script>
</body></html>
