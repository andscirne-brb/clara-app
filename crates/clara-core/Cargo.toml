[package]
name = "clara-core"
version = "0.1.0"
edition = "2024"

[dependencies]
calamine = { version = "0.36.1", default-features = false, features = ["dates"] }
csv = "1.4.0"
url = "2.5.8"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10.4"
getrandom = "0.4.3"
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
