name: Validar desenvolvimento
on:
  push:
    branches: ['desenvolvimento-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust estável
        run: rustup update stable && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-ciclo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-ciclo-
            windows-cargo-
      - run: npm ci
      - run: npm run verificar
      - name: Categorias de documentos com geometria fictícia
        shell: pwsh
        run: ./scripts/testar-documentos.ps1
      - name: Testes do núcleo e do Windows
        run: cargo test --workspace --release --locked
      - name: Preparar teste local da análise de capturas
        shell: pwsh
        run: |
          $messages = & cargo test -p clara-core --lib --release --no-run --locked --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Falhou a compilação do teste local.' }
          $artifacts = @($messages | Where-Object { $_.StartsWith('{') } | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'clara_core' -and $_.profile.test -and $_.executable })
          if ($artifacts.Count -ne 1) { throw 'Não foi identificado um único executável de teste.' }
          Copy-Item -LiteralPath $artifacts[0].executable -Destination 'clara-capturas-qa.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: clara-capturas-qa
          path: clara-capturas-qa.exe
          retention-days: 14
      - name: Escrita controlada do levantamento com dados fictícios
        run: python scripts/testar-escrita.py
      - name: Perfis no Excel com dados fictícios
        run: python scripts/testar-perfis-excel.py
      - name: Criar instalador de teste
        # O teste nativo do OCR corre localmente; os idiomas dos runners variam.
        run: npx tauri build
      - name: Testar instalação em máquina descartável
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Get-Item "target/release/bundle/nsis/Clara_${version}_x64-setup.exe"
          "CLARA_INSTALLER=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Clara\clara.exe'
          if (-not (Test-Path $exe)) { throw 'A Clara não foi instalada.' }
          $process = Start-Process -FilePath $exe -ArgumentList '--scheduled-backup' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'O teste de arranque falhou.' }
      - uses: actions/upload-artifact@v4
        with:
          name: clara-ciclo-instalador-teste
          path: ${{ env.CLARA_INSTALLER }}
          retention-days: 14
