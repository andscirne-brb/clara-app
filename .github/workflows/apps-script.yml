name: Validar Clara Apps Script
on:
  push:
    paths:
      - 'apps-script/clara/**'
      - 'scripts/testar-clara-apps.mjs'
      - 'scripts/testar-idealista.mjs'
      - 'scripts/testar-dashboard-visual.mjs'
      - 'scripts/construir-clara.py'
      - '.github/workflows/apps-script.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apps-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: node scripts/testar-clara-apps.mjs
      - run: node scripts/testar-idealista.mjs
      - run: node scripts/testar-dashboard-visual.mjs
      - run: python scripts/construir-clara.py
      - run: git diff --exit-code -- apps-script/clara/Clara-completo.gs
