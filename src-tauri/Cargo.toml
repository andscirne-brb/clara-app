[package]
name = "clara"
version = "0.7.1"
description = "Clara: controlo da presença dos imóveis nos portais"
authors = ["Andreia Cirne"]
edition = "2024"
publish = false

[lib]
name = "clara_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
clara-core = { path = "../crates/clara-core" }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
